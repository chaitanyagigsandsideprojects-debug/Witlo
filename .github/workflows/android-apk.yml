name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packages
        run: npm ci

      - name: Set build number
        run: node -e "const f='app.json';const j=require('./'+f);j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: 1

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$( (grep -A 25 "What went wrong" ../gradle.log; grep -E "^e: |error:|ERROR" ../gradle.log | head -15) | head -60 )
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
            echo "::error title=Gradle failed::$msg"
          fi
          exit $code

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Witlo-test-${{ github.run_number }}.apk
          ls -lh Witlo-test-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Witlo-test-${{ github.run_number }}
          path: Witlo-test-${{ github.run_number }}.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh

      - name: Publish as a release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Witlo test build ${{ github.run_number }}
          prerelease: true
          files: Witlo-test-${{ github.run_number }}.apk
          body: |
            Test APK for Android. Open this page on your phone, tap the .apk below, then allow "install unknown apps" when asked.
